services:
  app:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - REDIS_URL=redis://redis-db:6379
    depends_on:
      - redis-db
    volumes:
      - .:/app  # Optional: mounts local code for "hot-reload" during dev

  redis-db:
    image: redis:alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

volumes:
  redis_data:
